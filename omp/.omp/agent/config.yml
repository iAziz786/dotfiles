modelRoles:
  default: opencode-go/deepseek-v4.1-flash:max
  slow: opencode-go/muse-spark-1.3-contributor:max
  smol: opencode-go/deepseek-v4.1-flash:low
  advisor: anthropic/claude-sonnet-5-5:medium
  vision: anthropic/claude-haiku-5-5:auto
  commit: anthropic/claude-haiku-5-5:auto
defaultThinkingLevel: auto
symbolPreset: unicode
composer:
  shape: band
  tokenRate: true
theme:
  dark: dark-catppuccin
setupVersion: 2
display:
  showTokenUsage: false
  cacheMissMarker: true
  showTurnTime: false
statusLine:
  preset: custom
  transparent: true
  contextLine: embedded
  separator: none
  leftSegments:
    - model
    - path
  rightSegments:
    - cache_hit
    - cost
    - context_pct
    - status
  showHookStatus: false
dev:
  autoqaConsent: granted
task:
  agentModelOverrides:
    security-reviewer: merge-gateway/zai/glm-5.3-flash
    reviewer: opencode-go/muse-spark-1.3-contributor
    task: opencode-go/deepseek-v4.1-flash
autolearn:
  enabled: true
  autoContinue: true
memory:
  backend: local
advisor:
  enabled: true