[project]
name = "pwcli"
version = "1.0.0"
description = "Tools for working with playwright-cli output"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
parse-gmail-snapshot = "pwcli.gmail.cli:main"
linkedin-analytics = "pwcli.linkedin.analytics:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
